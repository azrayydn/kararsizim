<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Oturum süresi doldu · kararsızım</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           background: #e8ede5; color: #1e2b25; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 26rem; }
    .emoji { font-size: 3rem; margin: 0; }
    h1 { font-size: 1.6rem; margin: 0.5rem 0; letter-spacing: -0.02em; }
    p { color: #5a6b61; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: 0.9rem 1.6rem; border-radius: 999px; color: #fff;
        background: #4e7d68; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="emoji" aria-hidden="true">⏳</p>
    <h1>Sayfanın süresi dolmuş</h1>
    <p>Güvenlik nedeniyle işlem tamamlanamadı. Sayfayı yenileyip tekrar dene.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
