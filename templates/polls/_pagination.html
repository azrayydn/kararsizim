{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Sayfalar">
    {% if page_obj.has_previous %}
      <a class="btn btn--ghost btn--sm" href="?page={{ page_obj.previous_page_number }}">← Yeni anketler</a>
    {% else %}<span></span>{% endif %}
    <span class="pagination__info">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn--ghost btn--sm" href="?page={{ page_obj.next_page_number }}">Eski anketler →</a>
    {% else %}<span></span>{% endif %}
  </nav>
{% endif %}
